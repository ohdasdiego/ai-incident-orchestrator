##
# Nginx reverse proxy config for ai-incident-orchestrator
#
# Usage:
#   sudo cp nginx.conf /etc/nginx/sites-available/ai-incident-orchestrator
#   sudo ln -s /etc/nginx/sites-available/ai-incident-orchestrator /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
##

server {
    listen 80;
    server_name orchestrator.ado-runner.com;

    # SSE requires buffering off
    proxy_buffering off;
    proxy_cache off;

    location / {
        proxy_pass         http://127.0.0.1:5004;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE-specific headers
        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
        proxy_http_version    1.1;
        proxy_set_header      Connection '';
        chunked_transfer_encoding on;
    }
}
